  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Access Restricted</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#080a0f;
      --panel:#121722;
      --line:#263143;
      --text:#f2f4fa;
      --muted:#929bad;
      --accent:#2da8ee;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"IBM Plex Sans Condensed",sans-serif;
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        max(24px, env(safe-area-inset-top, 0px))
        max(20px, env(safe-area-inset-right, 0px))
        max(24px, env(safe-area-inset-bottom, 0px))
        max(20px, env(safe-area-inset-left, 0px));
    }
    main{
      width:100%;
      max-width:640px;
      text-align:center;
      background:var(--panel);
      border:2px solid var(--line);
      border-radius:20px;
      padding:clamp(40px,8vw,64px) clamp(24px,6vw,56px);
    }
    .lock{
      width:88px;
      height:88px;
      margin:0 auto 30px;
      border:2px solid var(--line);
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#0d1119;
    }
    .lock svg{
      width:40px;
      height:40px;
      display:block;
    }
    h1{
      margin:0 0 20px;
      font-size:clamp(34px,8.5vw,56px);
      font-weight:700;
      line-height:1.05;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .rule{
      width:56px;
      height:2px;
      background:var(--accent);
      margin:0 auto 24px;
      border-radius:1px;
    }
    p{
      margin:0;
      font-size:clamp(17px,4.4vw,21px);
      line-height:1.5;
      color:var(--text);
    }
    p.contact{
      margin-top:12px;
      color:var(--muted);
      font-size:clamp(15px,4vw,18px);
    }
    p.contact strong{
      color:var(--text);
      font-weight:600;
    }
    @media (prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>
<body>
  <main>
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2da8ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"></rect>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>
        <circle cx="12" cy="15.25" r="1.6" fill="#2da8ee" stroke="none"></circle>
      </svg>
    </div>
    <h1>Access Restricted</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Access to this dashboard has been restricted.</p>
    <p class="contact">For information regarding access, please contact <strong>Elias David</strong>.</p>
  </main>
</body>
</html>
